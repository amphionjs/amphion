version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Matches minimumReleaseAge in pnpm-workspace.yaml: let new releases settle first.
    cooldown:
      default-days: 1
    groups:
      dev-tooling:
        dependency-type: development
        patterns: ['*']
